name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install ffmpeg and SoX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg sox libsox-fmt-mp3
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest --cov=app --cov=dsp --cov-report=term --cov-report=json:coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.json
          retention-days: 7

  coverage-badge:
    name: Coverage badge
    # Written to the orphan `badges` branch as a shields.io endpoint, so the
    # README badge needs no third-party coverage service or token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Publish coverage.json to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pct=$(jq -r '.totals.percent_covered | floor' coverage.json)
          color=$(( pct >= 90 ? 1 : pct >= 80 ? 2 : pct >= 70 ? 3 : 4 ))
          color=$(echo "brightgreen green yellow red" | cut -d' ' -f$color)
          mkdir badges && cd badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "coverage ${pct}%"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges

  web:
    name: Web (prettier, eslint, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker (hadolint, multi-arch build, trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: simpleaudiospectral:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name sas --read-only --tmpfs /cache --tmpfs /tmp -p 127.0.0.1:4748:4748 simpleaudiospectral:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4748/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:4748/ | grep -q simpleaudiospectral
          docker rm -f sas
      - name: Trivy (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: simpleaudiospectral:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
